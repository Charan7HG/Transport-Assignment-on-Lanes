
spring.application.name=transporter-assignment-test

# Separate PostgreSQL test database
spring.datasource.url=jdbc:postgresql://localhost:5432/transporter_assignment_test
spring.datasource.username=transporter_app
spring.datasource.password=transport
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway migrations
spring.flyway.enabled=true

# Disable unnecessary SQL logging
logging.level.org.hibernate.SQL=INFO
